services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uangku-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@reusable-postgres:5432/uangku}
      LOCO_ENV: production
      PORT: 3000
      BINDING: 0.0.0.0
      HOST: ${HOST:-https://ainxgans.my.id/uangku}
      JWT_SECRET: ${JWT_SECRET}
      MAILER_ENABLE: ${MAILER_ENABLE:-false}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/config:/app/config:ro
    networks:
      - reusable-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uangku-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      BASE_PATH: /uangku
      ORIGIN: ${PUBLIC_DOMAIN:-https://ainxgans.my.id}
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - reusable-network

networks:
  reusable-network:
    external: true